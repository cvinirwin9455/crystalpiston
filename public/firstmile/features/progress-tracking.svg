<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="#fafbfc"/>
  
  <!-- Header -->
  <rect width="800" height="56" fill="#2d3436"/>
  <text x="24" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="700">Client Stats — Sarah Mitchell</text>
  
  <!-- Stats cards row -->
  <g transform="translate(24, 72)">
    <rect width="180" height="88" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="28" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">THIS WEEK</text>
    <text x="16" y="56" fill="#2d3436" font-family="Inter, sans-serif" font-size="28" font-weight="900">29km</text>
    <text x="16" y="76" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10" font-weight="600">↑ 12% vs last week</text>
    
    <g transform="translate(196, 0)">
      <rect width="180" height="88" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="28" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">COMPLETION RATE</text>
      <text x="16" y="56" fill="#2d3436" font-family="Inter, sans-serif" font-size="28" font-weight="900">92%</text>
      <text x="16" y="76" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10" font-weight="600">22 of 24 sessions this month</text>
    </g>
    
    <g transform="translate(392, 0)">
      <rect width="180" height="88" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="28" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">AVG RPE</text>
      <text x="16" y="56" fill="#2d3436" font-family="Inter, sans-serif" font-size="28" font-weight="900">6.2</text>
      <text x="16" y="76" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Moderate — well managed</text>
    </g>
    
    <g transform="translate(588, 0)">
      <rect width="180" height="88" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="28" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">WEEKS ACTIVE</text>
      <text x="16" y="56" fill="#2d3436" font-family="Inter, sans-serif" font-size="28" font-weight="900">8</text>
      <text x="16" y="76" fill="#f26522" font-family="Inter, sans-serif" font-size="10" font-weight="600">of 16 week plan</text>
    </g>
  </g>
  
  <!-- Weekly volume chart -->
  <rect x="24" y="180" width="500" height="240" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="208" fill="#2d3436" font-family="Inter, sans-serif" font-size="13" font-weight="700">Weekly Volume (km)</text>
  
  <!-- Chart bars -->
  <g transform="translate(56, 220)">
    <!-- Y axis labels -->
    <text x="-12" y="10" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="end">40</text>
    <text x="-12" y="50" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="end">30</text>
    <text x="-12" y="90" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="end">20</text>
    <text x="-12" y="130" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="end">10</text>
    <text x="-12" y="170" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="end">0</text>
    
    <!-- Grid lines -->
    <line x1="0" y1="5" x2="420" y2="5" stroke="#f0f4f8" stroke-width="1"/>
    <line x1="0" y1="45" x2="420" y2="45" stroke="#f0f4f8" stroke-width="1"/>
    <line x1="0" y1="85" x2="420" y2="85" stroke="#f0f4f8" stroke-width="1"/>
    <line x1="0" y1="125" x2="420" y2="125" stroke="#f0f4f8" stroke-width="1"/>
    <line x1="0" y1="165" x2="420" y2="165" stroke="#f0f4f8" stroke-width="1"/>
    
    <!-- Bars -->
    <rect x="10" y="105" width="36" height="60" rx="4" fill="#f26522" opacity="0.3"/>
    <rect x="62" y="85" width="36" height="80" rx="4" fill="#f26522" opacity="0.4"/>
    <rect x="114" y="70" width="36" height="95" rx="4" fill="#f26522" opacity="0.5"/>
    <rect x="166" y="55" width="36" height="110" rx="4" fill="#f26522" opacity="0.6"/>
    <rect x="218" y="50" width="36" height="115" rx="4" fill="#f26522" opacity="0.65"/>
    <rect x="270" y="42" width="36" height="123" rx="4" fill="#f26522" opacity="0.75"/>
    <rect x="322" y="35" width="36" height="130" rx="4" fill="#f26522" opacity="0.85"/>
    <rect x="374" y="28" width="36" height="137" rx="4" fill="#f26522"/>
    
    <!-- Week labels -->
    <text x="28" y="184" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">W1</text>
    <text x="80" y="184" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">W2</text>
    <text x="132" y="184" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">W3</text>
    <text x="184" y="184" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">W4</text>
    <text x="236" y="184" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">W5</text>
    <text x="288" y="184" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">W6</text>
    <text x="340" y="184" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">W7</text>
    <text x="392" y="184" fill="#f26522" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">W8</text>
  </g>
  
  <!-- Completion rate panel -->
  <rect x="540" y="180" width="236" height="240" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="556" y="208" fill="#2d3436" font-family="Inter, sans-serif" font-size="13" font-weight="700">Completion</text>
  
  <!-- Circular progress -->
  <circle cx="658" cy="300" r="60" fill="none" stroke="#e2e8f0" stroke-width="10"/>
  <circle cx="658" cy="300" r="60" fill="none" stroke="#f26522" stroke-width="10" stroke-dasharray="345 377" stroke-linecap="round" transform="rotate(-90 658 300)"/>
  <text x="658" y="296" fill="#2d3436" font-family="Inter, sans-serif" font-size="24" font-weight="900" text-anchor="middle">92%</text>
  <text x="658" y="316" fill="#555b5e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">this month</text>
  
  <text x="556" y="392" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Last month: 88%</text>
  <text x="556" y="408" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10" font-weight="600">↑ Improving</text>
  
  <!-- Recent sessions -->
  <rect x="24" y="436" width="752" height="148" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="464" fill="#2d3436" font-family="Inter, sans-serif" font-size="13" font-weight="700">Recent Sessions</text>
  
  <g transform="translate(40, 480)">
    <rect width="720" height="36" rx="6" fill="#e8f5e9"/>
    <text x="12" y="23" fill="#2e7d32" font-family="Inter, sans-serif" font-size="11" font-weight="600">✓ Mon — Easy Run 5km</text>
    <text x="500" y="23" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10">Completed · RPE 4</text>
    <text x="660" y="23" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9">2 days ago</text>
    
    <g transform="translate(0, 42)">
      <rect width="720" height="36" rx="6" fill="#e8f5e9"/>
      <text x="12" y="23" fill="#2e7d32" font-family="Inter, sans-serif" font-size="11" font-weight="600">✓ Tue — Strength Session</text>
      <text x="500" y="23" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10">Completed · RPE 6</text>
      <text x="660" y="23" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9">Yesterday</text>
    </g>
    
    <g transform="translate(0, 84)">
      <rect width="720" height="36" rx="6" fill="#fff3e0"/>
      <text x="12" y="23" fill="#e65100" font-family="Inter, sans-serif" font-size="11" font-weight="600">→ Wed — Intervals 6x800m</text>
      <text x="500" y="23" fill="#e65100" font-family="Inter, sans-serif" font-size="10">Today</text>
      <text x="660" y="23" fill="#e65100" font-family="Inter, sans-serif" font-size="9">Pending</text>
    </g>
  </g>
</svg>

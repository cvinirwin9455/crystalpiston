<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="#f8fafc"/>
  
  <!-- Header bar -->
  <rect width="800" height="56" fill="#2d3436"/>
  <text x="24" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="700">Week Planner</text>
  <rect x="680" y="16" width="90" height="28" rx="6" fill="#f26522"/>
  <text x="700" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Publish</text>
  
  <!-- Client info bar -->
  <rect y="56" width="800" height="44" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="40" cy="78" r="14" fill="#f26522" opacity="0.15"/>
  <text x="38" y="82" fill="#f26522" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SM</text>
  <text x="62" y="82" fill="#2d3436" font-family="Inter, sans-serif" font-size="13" font-weight="600">Sarah Mitchell</text>
  <text x="180" y="82" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="11">Week of Aug 18 – Aug 24, 2026</text>
  
  <!-- Day columns -->
  <g transform="translate(16, 116)">
    <!-- Monday -->
    <rect width="108" height="36" rx="8" fill="#2d3436"/>
    <text x="54" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MONDAY</text>
    <rect y="44" width="108" height="120" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="8" y="52" width="92" height="6" rx="3" fill="#f26522" opacity="0.8"/>
    <text x="12" y="72" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="700">Easy Run</text>
    <text x="12" y="86" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">5km @ easy pace</text>
    <text x="12" y="100" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">Zone 2, conversational</text>
    <rect x="8" y="112" width="44" height="18" rx="4" fill="#e8f5e9"/>
    <text x="14" y="124" fill="#2e7d32" font-family="Inter, sans-serif" font-size="8" font-weight="600">🏃 Run</text>
    <text x="12" y="150" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8">~30 min</text>
    
    <!-- Tuesday -->
    <g transform="translate(118, 0)">
      <rect width="108" height="36" rx="8" fill="#2d3436"/>
      <text x="54" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TUESDAY</text>
      <rect y="44" width="108" height="120" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="8" y="52" width="92" height="6" rx="3" fill="#6c5ce7"/>
      <text x="12" y="72" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="700">Strength</text>
      <text x="12" y="86" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">Lower body focus</text>
      <text x="12" y="100" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">Squats, lunges, core</text>
      <rect x="8" y="112" width="54" height="18" rx="4" fill="#ede7f6"/>
      <text x="14" y="124" fill="#5e35b1" font-family="Inter, sans-serif" font-size="8" font-weight="600">💪 Strength</text>
      <text x="12" y="150" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8">~45 min</text>
    </g>
    
    <!-- Wednesday -->
    <g transform="translate(236, 0)">
      <rect width="108" height="36" rx="8" fill="#2d3436"/>
      <text x="54" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WEDNESDAY</text>
      <rect y="44" width="108" height="120" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="8" y="52" width="92" height="6" rx="3" fill="#f26522"/>
      <text x="12" y="72" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="700">Intervals</text>
      <text x="12" y="86" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">6x 800m @ threshold</text>
      <text x="12" y="100" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">2min recovery jog</text>
      <rect x="8" y="112" width="44" height="18" rx="4" fill="#fff3e0"/>
      <text x="14" y="124" fill="#e65100" font-family="Inter, sans-serif" font-size="8" font-weight="600">⚡ Speed</text>
      <text x="12" y="150" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8">~50 min</text>
    </g>
    
    <!-- Thursday -->
    <g transform="translate(354, 0)">
      <rect width="108" height="36" rx="8" fill="#2d3436"/>
      <text x="54" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">THURSDAY</text>
      <rect y="44" width="108" height="80" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="8" y="52" width="92" height="6" rx="3" fill="#00b894"/>
      <text x="12" y="72" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="700">Rest Day</text>
      <text x="12" y="86" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">Active recovery</text>
      <text x="12" y="100" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">Walk or yoga</text>
      <rect x="8" y="112" width="40" height="0" rx="4" fill="#e0f7fa"/>
    </g>
    
    <!-- Friday -->
    <g transform="translate(472, 0)">
      <rect width="108" height="36" rx="8" fill="#2d3436"/>
      <text x="54" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FRIDAY</text>
      <rect y="44" width="108" height="120" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="8" y="52" width="92" height="6" rx="3" fill="#f26522" opacity="0.8"/>
      <text x="12" y="72" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="700">Tempo Run</text>
      <text x="12" y="86" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">8km @ half-marathon</text>
      <text x="12" y="100" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">pace, steady effort</text>
      <rect x="8" y="112" width="44" height="18" rx="4" fill="#e8f5e9"/>
      <text x="14" y="124" fill="#2e7d32" font-family="Inter, sans-serif" font-size="8" font-weight="600">🏃 Run</text>
      <text x="12" y="150" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8">~42 min</text>
    </g>
    
    <!-- Saturday -->
    <g transform="translate(590, 0)">
      <rect width="108" height="36" rx="8" fill="#2d3436"/>
      <text x="54" y="23" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SATURDAY</text>
      <rect y="44" width="108" height="120" rx="10" fill="#fff" stroke="#f26522" stroke-width="2"/>
      <rect x="8" y="52" width="92" height="6" rx="3" fill="#f26522"/>
      <text x="12" y="72" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="700">Long Run</text>
      <text x="12" y="86" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">16km @ easy pace</text>
      <text x="12" y="100" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">Negative split last 4k</text>
      <rect x="8" y="112" width="44" height="18" rx="4" fill="#e8f5e9"/>
      <text x="14" y="124" fill="#2e7d32" font-family="Inter, sans-serif" font-size="8" font-weight="600">🏃 Run</text>
      <text x="12" y="150" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8">~85 min</text>
    </g>
  </g>
  
  <!-- Summary bar at bottom -->
  <rect y="530" width="800" height="70" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="558" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">Week Summary</text>
  <text x="30" y="578" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">Total: 29km running · 1 strength · 1 rest</text>
  <rect x="580" y="542" width="100" height="32" rx="6" fill="#f26522" opacity="0.1"/>
  <text x="604" y="563" fill="#f26522" font-family="Inter, sans-serif" font-size="11" font-weight="700">✓ On Track</text>
  
  <!-- Drag indicator -->
  <rect x="300" y="350" width="108" height="40" rx="8" fill="#fff" stroke="#f26522" stroke-width="2" stroke-dasharray="4 2" opacity="0.7"/>
  <text x="320" y="375" fill="#f26522" font-family="Inter, sans-serif" font-size="10" font-weight="600">Drop here</text>
</svg>

      <text x="554" y="35" fill="#2e7d32" font-family="Inter, sans-serif" font-size="9" font-weight="600">✓ Published</text>
      <rect x="624" y="20" width="52" height="22" rx="11" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="634" y="35" fill="#555b5e" font-family="Inter, sans-serif" font-size="9" font-weight="600">View →</text>

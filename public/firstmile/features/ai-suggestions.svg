<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="#fafbfc"/>
  
  <!-- Header -->
  <rect width="800" height="56" fill="#2d3436"/>
  <text x="24" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="700">AI Week Suggestions</text>
  <rect x="620" y="14" width="150" height="30" rx="6" fill="#f26522" opacity="0.2" stroke="#f26522" stroke-width="1"/>
  <text x="654" y="34" fill="#f26522" font-family="Inter, sans-serif" font-size="11" font-weight="700">✨ Generate</text>
  
  <!-- Context panel -->
  <rect x="24" y="72" width="360" height="510" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="100" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">Context for Sarah Mitchell</text>
  
  <text x="40" y="130" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">CURRENT GOAL</text>
  <text x="40" y="148" fill="#2d3436" font-family="Inter, sans-serif" font-size="11">Half-marathon in 8 weeks (Oct 12)</text>
  
  <text x="40" y="178" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">LAST WEEK</text>
  <text x="40" y="196" fill="#2d3436" font-family="Inter, sans-serif" font-size="11">Total: 34km · 5/6 sessions completed</text>
  <text x="40" y="214" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Long run: 14km ✓ · Intervals: 5×1km ✓</text>
  
  <text x="40" y="244" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">CLIENT FEEDBACK</text>
  <text x="40" y="262" fill="#2d3436" font-family="Inter, sans-serif" font-size="11">"Felt strong on long run, intervals were tough</text>
  <text x="40" y="278" fill="#2d3436" font-family="Inter, sans-serif" font-size="11">but manageable. Calf was a bit tight Thu."</text>
  
  <text x="40" y="308" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">PROGRESSION</text>
  <rect x="40" y="318" width="200" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="40" y="318" width="120" height="6" rx="3" fill="#f26522"/>
  <text x="40" y="340" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Week 8 of 16 · Building phase</text>
  
  <!-- AI suggestion panel -->
  <rect x="400" y="72" width="376" height="510" rx="12" fill="#fff8f4" stroke="#f26522" stroke-width="1.5"/>
  <rect x="416" y="88" width="70" height="22" rx="11" fill="#f26522"/>
  <text x="432" y="103" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="700">✨ AI</text>
  <text x="500" y="103" fill="#f26522" font-family="Inter, sans-serif" font-size="11" font-weight="700">Suggested Week 9</text>
  
  <!-- Suggested plan -->
  <g transform="translate(416, 120)">
    <rect width="344" height="42" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="18" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600">MON</text>
    <text x="12" y="34" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="600">Easy Run — 6km @ Zone 2</text>
    <text x="280" y="28" fill="#2e7d32" font-family="Inter, sans-serif" font-size="9">~32min</text>
    
    <g transform="translate(0, 50)">
      <rect width="344" height="42" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600">TUE</text>
      <text x="12" y="34" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="600">Strength — Lower body (lighter, calf focus)</text>
      <text x="280" y="28" fill="#5e35b1" font-family="Inter, sans-serif" font-size="9">~40min</text>
    </g>
    
    <g transform="translate(0, 100)">
      <rect width="344" height="42" rx="6" fill="#fff" stroke="#f26522" stroke-width="1.5"/>
      <text x="12" y="18" fill="#f26522" font-family="Inter, sans-serif" font-size="9" font-weight="600">WED ⭐</text>
      <text x="12" y="34" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="600">Threshold — 3×10min @ HM pace, 3min jog</text>
      <text x="280" y="28" fill="#e65100" font-family="Inter, sans-serif" font-size="9">~52min</text>
    </g>
    
    <g transform="translate(0, 150)">
      <rect width="344" height="42" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600">THU</text>
      <text x="12" y="34" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="600">Rest — Active recovery, foam roll calves</text>
      <text x="280" y="28" fill="#00897b" font-family="Inter, sans-serif" font-size="9">rest</text>
    </g>
    
    <g transform="translate(0, 200)">
      <rect width="344" height="42" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="18" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600">FRI</text>
      <text x="12" y="34" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="600">Easy Run — 5km with strides</text>
      <text x="280" y="28" fill="#2e7d32" font-family="Inter, sans-serif" font-size="9">~28min</text>
    </g>
    
    <g transform="translate(0, 250)">
      <rect width="344" height="42" rx="6" fill="#fff" stroke="#f26522" stroke-width="1.5"/>
      <text x="12" y="18" fill="#f26522" font-family="Inter, sans-serif" font-size="9" font-weight="600">SAT ⭐</text>
      <text x="12" y="34" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="600">Long Run — 16km, negative split last 5km</text>
      <text x="280" y="28" fill="#e65100" font-family="Inter, sans-serif" font-size="9">~85min</text>
    </g>
    
    <!-- Total -->
    <rect y="304" width="344" height="32" rx="6" fill="#f26522" opacity="0.1"/>
    <text x="12" y="325" fill="#f26522" font-family="Inter, sans-serif" font-size="11" font-weight="700">Total: 37km (+3km from last week) · 5 sessions</text>
    
    <!-- Rationale -->
    <text y="360" fill="#555b5e" font-family="Inter, sans-serif" font-size="10" font-style="italic">"Progressing volume by ~10%. Replaced 800m</text>
    <text y="376" fill="#555b5e" font-family="Inter, sans-serif" font-size="10" font-style="italic">intervals with longer threshold efforts to build</text>
    <text y="392" fill="#555b5e" font-family="Inter, sans-serif" font-size="10" font-style="italic">race-specific endurance. Lighter strength for</text>
    <text y="408" fill="#555b5e" font-family="Inter, sans-serif" font-size="10" font-style="italic">calf recovery."</text>
  </g>
  
  <!-- Action buttons -->
  <rect x="416" y="544" width="160" height="32" rx="6" fill="#f26522"/>
  <text x="460" y="565" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700">Accept &amp; Edit →</text>
  <rect x="586" y="544" width="100" height="32" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="606" y="565" fill="#555b5e" font-family="Inter, sans-serif" font-size="11" font-weight="600">Regenerate</text>
</svg>

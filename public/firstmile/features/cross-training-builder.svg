<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="#fafbfc"/>
  
  <!-- Header -->
  <rect width="800" height="56" fill="#2d3436"/>
  <text x="24" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="700">Cross-Training Builder</text>
  <text x="620" y="35" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="11">Tuesday · Strength</text>
  
  <!-- Session title -->
  <rect x="24" y="72" width="752" height="44" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="98" fill="#2d3436" font-family="Inter, sans-serif" font-size="14" font-weight="700">Lower Body Strength — Running-Specific</text>
  
  <!-- Circuit A -->
  <g transform="translate(24, 132)">
    <rect width="752" height="28" rx="6" fill="#6c5ce7" opacity="0.1"/>
    <text x="12" y="19" fill="#6c5ce7" font-family="Inter, sans-serif" font-size="11" font-weight="700">CIRCUIT A — 3 rounds, 60s rest between rounds</text>
    
    <!-- Exercise rows -->
    <rect y="36" width="752" height="52" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="55" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">1. Barbell Back Squat</text>
    <text x="16" y="74" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Full depth, control the eccentric</text>
    <rect x="520" y="46" width="60" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="534" y="63" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="600">4 × 8</text>
    <rect x="590" y="46" width="70" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="63" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">90s rest</text>
    <rect x="668" y="46" width="60" height="24" rx="4" fill="#ede7f6"/>
    <text x="680" y="63" fill="#5e35b1" font-family="Inter, sans-serif" font-size="9" font-weight="600">📹 Video</text>
    
    <rect y="96" width="752" height="52" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="115" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">2. Romanian Deadlift</text>
    <text x="16" y="134" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Hinge at hips, slight knee bend</text>
    <rect x="520" y="106" width="60" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="534" y="123" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="600">3 × 10</text>
    <rect x="590" y="106" width="70" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="123" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">60s rest</text>
    <rect x="668" y="106" width="60" height="24" rx="4" fill="#ede7f6"/>
    <text x="680" y="123" fill="#5e35b1" font-family="Inter, sans-serif" font-size="9" font-weight="600">📹 Video</text>
    
    <rect y="156" width="752" height="52" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="175" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">3. Walking Lunges</text>
    <text x="16" y="194" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">With dumbbells, controlled steps</text>
    <rect x="520" y="166" width="60" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="530" y="183" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="600">3 × 12/leg</text>
    <rect x="590" y="166" width="70" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="183" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">60s rest</text>
    <rect x="668" y="166" width="60" height="24" rx="4" fill="#ede7f6"/>
    <text x="680" y="183" fill="#5e35b1" font-family="Inter, sans-serif" font-size="9" font-weight="600">📹 Video</text>
  </g>
  
  <!-- Circuit B -->
  <g transform="translate(24, 362)">
    <rect width="752" height="28" rx="6" fill="#f26522" opacity="0.1"/>
    <text x="12" y="19" fill="#f26522" font-family="Inter, sans-serif" font-size="11" font-weight="700">SUPERSET B — 3 rounds, 45s rest between rounds</text>
    
    <rect y="36" width="752" height="52" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="55" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">4. Single-Leg Calf Raise</text>
    <text x="16" y="74" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Full ROM, pause at top</text>
    <rect x="520" y="46" width="60" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="530" y="63" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="600">3 × 15/leg</text>
    <rect x="590" y="46" width="70" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="63" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">No rest</text>
    <rect x="668" y="46" width="60" height="24" rx="4" fill="#ede7f6"/>
    <text x="680" y="63" fill="#5e35b1" font-family="Inter, sans-serif" font-size="9" font-weight="600">📹 Video</text>
    
    <rect y="96" width="752" height="52" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="115" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">5. Dead Bug</text>
    <text x="16" y="134" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Opposite arm/leg, brace core</text>
    <rect x="520" y="106" width="60" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="530" y="123" fill="#2d3436" font-family="Inter, sans-serif" font-size="10" font-weight="600">3 × 10/side</text>
    <rect x="590" y="106" width="70" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="123" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">45s rest</text>
    <rect x="668" y="106" width="60" height="24" rx="4" fill="#ede7f6"/>
    <text x="680" y="123" fill="#5e35b1" font-family="Inter, sans-serif" font-size="9" font-weight="600">📹 Video</text>
  </g>
  
  <!-- Bottom summary -->
  <rect x="24" y="546" width="752" height="38" rx="8" fill="#2d3436"/>
  <text x="40" y="570" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="600">5 exercises · 2 circuits · Est. 45 min · Difficulty: Moderate</text>
</svg>

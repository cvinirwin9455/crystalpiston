<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="#fafbfc"/>
  
  <!-- Header -->
  <rect width="800" height="56" fill="#2d3436"/>
  <text x="24" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="700">Account Settings</text>
  
  <!-- Export section -->
  <rect x="24" y="80" width="752" height="200" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="112" fill="#2d3436" font-family="Inter, sans-serif" font-size="16" font-weight="800">Export Your Data</text>
  <text x="44" y="134" fill="#555b5e" font-family="Inter, sans-serif" font-size="12">Your data belongs to you. Export everything anytime — no questions asked.</text>
  
  <!-- Export options -->
  <g transform="translate(44, 152)">
    <rect width="220" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="16" y="20" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="700">📊 Client List</text>
    <text x="16" y="38" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">Names, emails, status, goals</text>
    <rect x="160" y="12" width="48" height="24" rx="4" fill="#f26522"/>
    <text x="170" y="29" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="700">CSV</text>
    
    <g transform="translate(236, 0)">
      <rect width="220" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="20" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="700">📋 Training Plans</text>
      <text x="16" y="38" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">All weeks, workouts, notes</text>
      <rect x="160" y="12" width="48" height="24" rx="4" fill="#f26522"/>
      <text x="170" y="29" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="700">CSV</text>
    </g>
    
    <g transform="translate(472, 0)">
      <rect width="220" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="20" fill="#2d3436" font-family="Inter, sans-serif" font-size="11" font-weight="700">💬 Messages</text>
      <text x="16" y="38" fill="#555b5e" font-family="Inter, sans-serif" font-size="9">Full conversation history</text>
      <rect x="160" y="12" width="48" height="24" rx="4" fill="#f26522"/>
      <text x="170" y="29" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="700">CSV</text>
    </g>
  </g>
  
  <rect x="44" y="222" width="180" height="40" rx="8" fill="#f26522"/>
  <text x="82" y="247" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="700">Export All Data ↓</text>
  
  <!-- No lock-in section -->
  <rect x="24" y="300" width="752" height="140" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="44" y="332" fill="#2e7d32" font-family="Inter, sans-serif" font-size="16" font-weight="800">✓ No Lock-in. Ever.</text>
  
  <g transform="translate(44, 348)">
    <text y="0" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">• Cancel anytime — no contracts, no cancellation fees</text>
    <text y="24" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">• Take all your data with you if you move platforms</text>
    <text y="48" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">• We celebrate when you outgrow us (seriously)</text>
    <text y="72" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">• No hidden costs, no "enterprise" upsells, no surprises</text>
  </g>
  
  <!-- Comparison section -->
  <rect x="24" y="460" width="752" height="116" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="44" y="492" fill="#2d3436" font-family="Inter, sans-serif" font-size="13" font-weight="700">How other platforms handle this:</text>
  
  <g transform="translate(44, 508)">
    <rect width="340" height="48" rx="8" fill="#fce4ec"/>
    <text x="16" y="20" fill="#c62828" font-family="Inter, sans-serif" font-size="10" font-weight="600">✗ TrainHeroic / TrueCoach</text>
    <text x="16" y="38" fill="#c62828" font-family="Inter, sans-serif" font-size="10">Limited export, data locked in their format</text>
    
    <g transform="translate(360, 0)">
      <rect width="340" height="48" rx="8" fill="#e8f5e9"/>
      <text x="16" y="20" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10" font-weight="600">✓ First Mile Coach</text>
      <text x="16" y="38" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10">Full CSV export of everything, anytime, free</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" fill="none">
  <!-- Phone frame -->
  <rect width="400" height="700" rx="32" fill="#2d3436"/>
  <rect x="8" y="8" width="384" height="684" rx="28" fill="#fafbfc"/>
  
  <!-- Status bar -->
  <rect x="8" y="8" width="384" height="44" rx="28" fill="#fff"/>
  <text x="190" y="34" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">9:41</text>
  
  <!-- App header -->
  <rect x="8" y="52" width="384" height="56" fill="#2d3436"/>
  <text x="28" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="700">My Training</text>
  <circle cx="360" cy="80" r="16" fill="#f26522" opacity="0.2"/>
  <text x="360" y="84" fill="#f26522" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SM</text>
  
  <!-- Today's workout card -->
  <rect x="24" y="124" width="352" height="160" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="148" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">TODAY · WEDNESDAY</text>
  <text x="40" y="172" fill="#2d3436" font-family="Inter, sans-serif" font-size="18" font-weight="800">Interval Session</text>
  <text x="40" y="196" fill="#555b5e" font-family="Inter, sans-serif" font-size="12">6x 800m @ threshold pace</text>
  <text x="40" y="214" fill="#555b5e" font-family="Inter, sans-serif" font-size="12">2min recovery jog between reps</text>
  
  <!-- Tags -->
  <rect x="40" y="228" width="56" height="22" rx="11" fill="#fff3e0"/>
  <text x="50" y="243" fill="#e65100" font-family="Inter, sans-serif" font-size="9" font-weight="600">⚡ Speed</text>
  <rect x="104" y="228" width="52" height="22" rx="11" fill="#e8f5e9"/>
  <text x="114" y="243" fill="#2e7d32" font-family="Inter, sans-serif" font-size="9" font-weight="600">~50min</text>
  
  <rect x="40" y="256" width="136" height="18" rx="4" fill="#f26522"/>
  <text x="72" y="269" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="700">Log This Session →</text>
  
  <!-- This week section -->
  <text x="24" y="316" fill="#2d3436" font-family="Inter, sans-serif" font-size="14" font-weight="700">This Week</text>
  <text x="310" y="316" fill="#f26522" font-family="Inter, sans-serif" font-size="11" font-weight="600">See All →</text>
  
  <!-- Week days mini cards -->
  <g transform="translate(24, 328)">
    <rect width="48" height="64" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="24" y="20" fill="#2e7d32" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">MON</text>
    <text x="24" y="38" fill="#2e7d32" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">✓</text>
    <text x="24" y="56" fill="#2e7d32" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">5km</text>
    
    <g transform="translate(58, 0)">
      <rect width="48" height="64" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
      <text x="24" y="20" fill="#2e7d32" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">TUE</text>
      <text x="24" y="38" fill="#2e7d32" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">✓</text>
      <text x="24" y="56" fill="#2e7d32" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Gym</text>
    </g>
    
    <g transform="translate(116, 0)">
      <rect width="48" height="64" rx="10" fill="#fff3e0" stroke="#f26522" stroke-width="2"/>
      <text x="24" y="20" fill="#f26522" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">WED</text>
      <text x="24" y="40" fill="#f26522" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">→</text>
      <text x="24" y="56" fill="#f26522" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Today</text>
    </g>
    
    <g transform="translate(174, 0)">
      <rect width="48" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="24" y="20" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">THU</text>
      <text x="24" y="40" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🧘</text>
      <text x="24" y="56" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Rest</text>
    </g>
    
    <g transform="translate(232, 0)">
      <rect width="48" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="24" y="20" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">FRI</text>
      <text x="24" y="40" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🏃</text>
      <text x="24" y="56" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">8km</text>
    </g>
    
    <g transform="translate(290, 0)">
      <rect width="48" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="24" y="20" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">SAT</text>
      <text x="24" y="40" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🏃</text>
      <text x="24" y="56" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">16km</text>
    </g>
  </g>
  
  <!-- Coach notes card -->
  <rect x="24" y="412" width="352" height="100" rx="12" fill="#fff8f4" stroke="#f26522" stroke-width="1" opacity="0.8"/>
  <text x="40" y="436" fill="#f26522" font-family="Inter, sans-serif" font-size="10" font-weight="700">💬 Coach Notes</text>
  <text x="40" y="460" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">Great work on Monday! For today's intervals,</text>
  <text x="40" y="476" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">focus on keeping your form relaxed in the last</text>
  <text x="40" y="492" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">2 reps. Don't chase the watch!</text>
  
  <!-- Progress card -->
  <rect x="24" y="528" width="352" height="80" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="552" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">This Week's Progress</text>
  <rect x="40" y="564" width="220" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="40" y="564" width="95" height="8" rx="4" fill="#f26522"/>
  <text x="40" y="592" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">3 of 6 sessions completed</text>
  <text x="300" y="592" fill="#f26522" font-family="Inter, sans-serif" font-size="11" font-weight="700">50%</text>
  
  <!-- Bottom nav -->
  <rect x="8" y="628" width="384" height="64" rx="0" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="660" fill="#f26522" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Training</text>
  <text x="200" y="660" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Messages</text>
  <text x="320" y="660" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Account</text>
</svg>

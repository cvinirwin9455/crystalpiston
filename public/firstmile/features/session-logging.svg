<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" fill="none">
  <!-- Phone frame -->
  <rect width="400" height="700" rx="32" fill="#2d3436"/>
  <rect x="8" y="8" width="384" height="684" rx="28" fill="#fafbfc"/>
  
  <!-- Status bar -->
  <rect x="8" y="8" width="384" height="44" rx="28" fill="#fff"/>
  <text x="190" y="34" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">9:41</text>
  
  <!-- Header -->
  <rect x="8" y="52" width="384" height="56" fill="#2d3436"/>
  <text x="28" y="85" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="700">Log Session</text>
  <text x="330" y="85" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="11">Wed</text>
  
  <!-- Workout info -->
  <rect x="24" y="124" width="352" height="72" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="148" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">PLANNED</text>
  <text x="40" y="168" fill="#2d3436" font-family="Inter, sans-serif" font-size="14" font-weight="700">Intervals — 6×800m @ Threshold</text>
  <text x="40" y="186" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">Target: ~50 min · 2min recovery</text>
  
  <!-- Actual input -->
  <text x="24" y="224" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">What did you actually do?</text>
  
  <rect x="24" y="236" width="352" height="44" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="263" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">Completed all 6 reps ✓</text>
  
  <!-- RPE slider -->
  <text x="24" y="310" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">How hard did it feel? (RPE)</text>
  <rect x="24" y="322" width="352" height="44" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="340" width="260" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="40" y="340" width="182" height="6" rx="3" fill="#f26522"/>
  <circle cx="222" cy="343" r="10" fill="#f26522"/>
  <text x="222" y="347" fill="#fff" font-family="Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">7</text>
  <text x="320" y="348" fill="#f26522" font-family="Inter, sans-serif" font-size="14" font-weight="800">7/10</text>
  
  <!-- Energy level -->
  <text x="24" y="398" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">Energy level today</text>
  <g transform="translate(24, 410)">
    <rect width="68" height="34" rx="17" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="34" y="22" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">😴 Low</text>
    
    <rect x="76" y="0" width="76" height="34" rx="17" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="114" y="22" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">😐 Medium</text>
    
    <rect x="160" y="0" width="68" height="34" rx="17" fill="#f26522" stroke="#f26522" stroke-width="1"/>
    <text x="194" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚡ High</text>
    
    <rect x="236" y="0" width="76" height="34" rx="17" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="274" y="22" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">🔥 Great!</text>
  </g>
  
  <!-- Notes -->
  <text x="24" y="480" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">Notes for your coach</text>
  <rect x="24" y="492" width="352" height="80" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="514" fill="#2d3436" font-family="Inter, sans-serif" font-size="11">Felt strong through rep 4, legs were</text>
  <text x="40" y="532" fill="#2d3436" font-family="Inter, sans-serif" font-size="11">heavy on 5 &amp; 6 but held pace. No calf</text>
  <text x="40" y="550" fill="#2d3436" font-family="Inter, sans-serif" font-size="11">issues today!</text>
  
  <!-- Submit button -->
  <rect x="24" y="596" width="352" height="48" rx="8" fill="#f26522"/>
  <text x="200" y="625" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Log Session ✓</text>
  
  <!-- Bottom hint -->
  <text x="200" y="664" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Your coach will be notified</text>
</svg>

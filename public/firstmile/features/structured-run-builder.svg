<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="#fafbfc"/>
  
  <!-- Header -->
  <rect width="800" height="56" fill="#2d3436"/>
  <text x="24" y="35" fill="#fff" font-family="Inter, sans-serif" font-size="15" font-weight="700">Structured Run Builder</text>
  <text x="680" y="35" fill="#f26522" font-family="Inter, sans-serif" font-size="12" font-weight="600">Save →</text>
  
  <!-- Session title -->
  <rect x="24" y="72" width="752" height="48" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="100" fill="#2d3436" font-family="Inter, sans-serif" font-size="14" font-weight="700">Wednesday Intervals — 6x 800m</text>
  
  <!-- Steps -->
  <g transform="translate(24, 136)">
    <!-- Warm up -->
    <rect width="752" height="70" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="70" rx="3" fill="#00b894"/>
    <text x="24" y="24" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">WARM UP</text>
    <text x="24" y="44" fill="#2d3436" font-family="Inter, sans-serif" font-size="13" font-weight="700">Easy Jog</text>
    <text x="24" y="60" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">10 minutes at conversational pace</text>
    <rect x="620" y="20" width="60" height="28" rx="6" fill="#e0f7fa"/>
    <text x="632" y="39" fill="#00897b" font-family="Inter, sans-serif" font-size="11" font-weight="600">10 min</text>
    <rect x="690" y="20" width="44" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="700" y="39" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">Zone 1</text>
    
    <!-- Interval block -->
    <g transform="translate(0, 82)">
      <rect width="752" height="180" rx="10" fill="#fff8f4" stroke="#f26522" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="180" rx="3" fill="#f26522"/>
      <text x="24" y="24" fill="#f26522" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1">REPEAT × 6</text>
      
      <!-- Work interval -->
      <rect x="24" y="36" width="704" height="56" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="24" y="36" width="4" height="56" fill="#f26522"/>
      <text x="44" y="56" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">800m @ Threshold</text>
      <text x="44" y="76" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">Target: 3:20–3:30 pace | RPE 7-8</text>
      <rect x="600" y="48" width="60" height="24" rx="6" fill="#fff3e0"/>
      <text x="612" y="65" fill="#e65100" font-family="Inter, sans-serif" font-size="10" font-weight="600">800m</text>
      <rect x="668" y="48" width="44" height="24" rx="6" fill="#fce4ec"/>
      <text x="678" y="65" fill="#c62828" font-family="Inter, sans-serif" font-size="10">Zone 4</text>
      
      <!-- Recovery -->
      <rect x="24" y="100" width="704" height="56" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="24" y="100" width="4" height="56" fill="#00b894"/>
      <text x="44" y="120" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="700">Recovery Jog</text>
      <text x="44" y="140" fill="#555b5e" font-family="Inter, sans-serif" font-size="10">2 minutes easy jog between reps</text>
      <rect x="600" y="112" width="60" height="24" rx="6" fill="#e0f7fa"/>
      <text x="614" y="129" fill="#00897b" font-family="Inter, sans-serif" font-size="10" font-weight="600">2 min</text>
      <rect x="668" y="112" width="44" height="24" rx="6" fill="#e8f5e9"/>
      <text x="678" y="129" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10">Zone 1</text>
      
      <!-- Add step button -->
      <rect x="310" y="164" width="130" height="0" rx="4" fill="none"/>
    </g>
    
    <!-- Cool down -->
    <g transform="translate(0, 274)">
      <rect width="752" height="70" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="70" rx="3" fill="#74b9ff"/>
      <text x="24" y="24" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">COOL DOWN</text>
      <text x="24" y="44" fill="#2d3436" font-family="Inter, sans-serif" font-size="13" font-weight="700">Easy Jog + Stretching</text>
      <text x="24" y="60" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">10 minutes easy, then static stretches</text>
      <rect x="620" y="20" width="60" height="28" rx="6" fill="#e3f2fd"/>
      <text x="632" y="39" fill="#1565c0" font-family="Inter, sans-serif" font-size="11" font-weight="600">10 min</text>
      <rect x="690" y="20" width="44" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="700" y="39" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">Zone 1</text>
    </g>
    
    <!-- Add step button -->
    <g transform="translate(0, 356)">
      <rect width="752" height="44" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 3"/>
      <text x="376" y="28" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add Step</text>
    </g>
  </g>
  
  <!-- Summary -->
  <rect x="24" y="540" width="752" height="44" rx="8" fill="#2d3436"/>
  <text x="40" y="566" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Total: ~50 min · 800m × 6 + warm up/cool down · Estimated 8.8km</text>
</svg>

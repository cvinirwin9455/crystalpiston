<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background - email client look -->
  <rect width="800" height="600" rx="12" fill="#f0f4f8"/>
  
  <!-- Email preview card -->
  <rect x="80" y="40" width="640" height="520" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Email header -->
  <rect x="80" y="40" width="640" height="80" rx="12" fill="#fff"/>
  <rect x="80" y="118" width="640" height="1" fill="#e2e8f0"/>
  <text x="110" y="72" fill="#2d3436" font-family="Inter, sans-serif" font-size="16" font-weight="800">New training plan published! 🎉</text>
  <text x="110" y="96" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="11">From: Crystal via First Mile Coach · To: sarah@email.com</text>
  <text x="110" y="112" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">Today at 8:15 AM</text>
  
  <!-- Email body -->
  <g transform="translate(110, 140)">
    <text x="0" y="24" fill="#2d3436" font-family="Inter, sans-serif" font-size="13">Hi Sarah,</text>
    <text x="0" y="56" fill="#555b5e" font-family="Inter, sans-serif" font-size="13">Crystal has published your training plan for this week</text>
    <text x="0" y="76" fill="#555b5e" font-family="Inter, sans-serif" font-size="13">(Aug 18 – Aug 24).</text>
    
    <!-- Plan preview card in email -->
    <rect x="0" y="100" width="560" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="128" fill="#f26522" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1">THIS WEEK'S PLAN</text>
    <text x="20" y="152" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="600">Mon: Easy Run 5km</text>
    <text x="20" y="172" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="600">Tue: Lower Body Strength</text>
    <text x="20" y="192" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="600">Wed: Intervals 6x800m</text>
    <text x="20" y="212" fill="#2d3436" font-family="Inter, sans-serif" font-size="12" font-weight="600">Fri: Tempo 8km</text>
    <text x="20" y="230" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">+ 2 more days</text>
    <text x="420" y="128" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">Total: 29km</text>
    <text x="420" y="148" fill="#555b5e" font-family="Inter, sans-serif" font-size="11">6 sessions</text>
    
    <!-- CTA button in email -->
    <rect x="0" y="260" width="200" height="44" rx="8" fill="#f26522"/>
    <text x="100" y="287" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">View Full Plan →</text>
    
    <text x="0" y="330" fill="#555b5e" font-family="Inter, sans-serif" font-size="12">Coach's note: "Great week ahead! Wednesday is the</text>
    <text x="0" y="350" fill="#555b5e" font-family="Inter, sans-serif" font-size="12">key session — let me know how those intervals feel."</text>
    
    <text x="0" y="390" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">—</text>
    <text x="0" y="410" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="10">Sent via First Mile Coach · Reply to this email to message your coach</text>
  </g>
  
  <!-- Other emails in background (stacked effect) -->
  <rect x="90" y="570" width="620" height="20" rx="4" fill="#e2e8f0" opacity="0.5"/>
  <rect x="100" y="580" width="600" height="20" rx="4" fill="#e2e8f0" opacity="0.3"/>
</svg>

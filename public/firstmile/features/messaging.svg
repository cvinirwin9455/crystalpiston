<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" rx="12" fill="#fafbfc"/>
  
  <!-- Header -->
  <rect width="800" height="56" fill="#2d3436"/>
  <circle cx="36" cy="28" r="16" fill="#f26522" opacity="0.2"/>
  <text x="36" y="32" fill="#f26522" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SM</text>
  <text x="62" y="24" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="700">Sarah Mitchell</text>
  <text x="62" y="42" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="10">Last active 2 hours ago</text>
  
  <!-- Messages -->
  <g transform="translate(24, 72)">
    <!-- Coach message -->
    <g transform="translate(200, 16)">
      <rect width="360" height="80" rx="12" fill="#2d3436"/>
      <text x="16" y="24" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="9" font-weight="600">YOU · 9:15 AM</text>
      <text x="16" y="44" fill="#fff" font-family="Inter, sans-serif" font-size="12">Hey Sarah! How did the long run feel</text>
      <text x="16" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="12">yesterday? Any tightness in that left calf?</text>
    </g>
    
    <!-- Client message -->
    <g transform="translate(24, 112)">
      <rect width="380" height="100" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600">SARAH · 10:32 AM</text>
      <text x="16" y="44" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">Felt amazing actually! No calf issues at all.</text>
      <text x="16" y="62" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">Managed a negative split on the last 4K too.</text>
      <text x="16" y="80" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">Really pleased with that 🎉</text>
    </g>
    
    <!-- Coach message -->
    <g transform="translate(180, 228)">
      <rect width="380" height="80" rx="12" fill="#2d3436"/>
      <text x="16" y="24" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="9" font-weight="600">YOU · 10:45 AM</text>
      <text x="16" y="44" fill="#fff" font-family="Inter, sans-serif" font-size="12">That's brilliant! The negative split shows your</text>
      <text x="16" y="62" fill="#fff" font-family="Inter, sans-serif" font-size="12">pacing discipline is really improving 💪</text>
    </g>
    
    <!-- Client message -->
    <g transform="translate(24, 324)">
      <rect width="320" height="60" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="9" font-weight="600">SARAH · 11:02 AM</text>
      <text x="16" y="44" fill="#2d3436" font-family="Inter, sans-serif" font-size="12">Thanks! Ready for Wednesday's intervals 🔥</text>
    </g>
    
    <!-- Notification badge -->
    <g transform="translate(360, 395)">
      <rect width="200" height="28" rx="14" fill="#e8f5e9"/>
      <text x="100" y="18" fill="#2e7d32" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">✉️ Email notification sent to coach</text>
    </g>
  </g>
  
  <!-- Input area -->
  <rect y="500" width="800" height="100" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="520" width="660" height="48" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="48" y="549" fill="#9e9e9e" font-family="Inter, sans-serif" font-size="13">Type a message...</text>
  <rect x="700" y="520" width="76" height="48" rx="24" fill="#f26522"/>
  <text x="738" y="549" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Send</text>
</svg>
